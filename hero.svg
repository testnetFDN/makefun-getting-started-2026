  <text x="454" y="414" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="12.5" font-weight="700" fill="#FF4F9A" letter-spacing="1.6">2 · BUILD</text>
  <text x="454" y="446" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="19.5" font-weight="700" fill="#F8FAFC">Let the agent cook</text>
  <text x="454" y="478" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94A3B8">Your AI coding agent writes the entry;</text>
  <text x="454" y="500" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94A3B8">make.fun checks the transcripts prove it.</text>

  <!-- Card 3 -->
  <rect x="788" y="382" width="336" height="152" rx="14" fill="#1B1F2A" stroke="#2B3040" stroke-width="1.25" />
  <text x="810" y="414" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="12.5" font-weight="700" fill="#FF4F9A" letter-spacing="1.6">3 · CASH OUT</text>
  <text x="810" y="446" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="19.5" font-weight="700" fill="#F8FAFC">Winners get paid</text>
  <text x="810" y="478" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#94A3B8">The sandbox grades it, leaderboard</text>
