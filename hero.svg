  <text x="108" y="634" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="30" font-weight="800" fill="#FF4F9A" letter-spacing="-0.5">make.fun/r/9fgvvrhd</text>

  <!-- Right solid pill button -->
  <rect x="896" y="584" width="196" height="48" rx="24" fill="#FF4F9A" />
  <text x="994" y="614" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16.5" font-weight="800" fill="#0F1117">Play free →</text>
