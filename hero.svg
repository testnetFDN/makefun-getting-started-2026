    <path d="M14 2C7.373 2 2 7.373 2 14v12.2c0 .9.98 1.45 1.74.98l2.76-1.72a1.2 1.2 0 0 1 1.28 0l2.58 1.62a1.2 1.2 0 0 0 1.28 0l2.36-1.48a1.2 1.2 0 0 1 1.28 0l2.36 1.48a1.2 1.2 0 0 0 1.28 0l2.58-1.62a1.2 1.2 0 0 1 1.28 0l2.76 1.72c.76.47 1.74-.08 1.74-.98V14C26 7.373 20.627 2 14 2Z" fill="#FF4F9A" />
